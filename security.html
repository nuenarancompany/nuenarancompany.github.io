<!doctype html>
<html lang="ckb" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نوینەران — ئاسایش</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172554;font:16px system-ui,sans-serif}header{background:#2346ae;color:white;padding:12px;display:flex;align-items:center;gap:12px}img{width:82px;height:46px;object-fit:contain;background:white;border-radius:8px;padding:3px}main{max-width:760px;margin:auto;padding:14px}input,select,button{font:inherit;padding:12px;border:1px solid #cbd5e1;border-radius:9px;background:white;min-height:46px}input,select{width:100%;margin-bottom:10px}button{cursor:pointer;color:#2346ae}article{background:white;border:1px solid #dbe4ee;border-radius:12px;padding:16px;margin:12px 0}h2{font-size:19px;margin:0 0 12px}dl{margin:0;display:grid;grid-template-columns:1fr 1.4fr;gap:10px}dd{margin:0;overflow-wrap:anywhere}dt{color:#64748b}footer{border-top:1px solid #e2e8f0;margin-top:14px;padding-top:12px;line-height:1.8}#status{font-size:14px;color:#475569;margin:6px 0 14px}.error{color:#b91c1c!important}[hidden]{display:none!important}#login{max-width:400px;margin:40px auto;text-align:center}#login img{width:190px;height:90px}a{color:inherit}small{display:block;color:#64748b}nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
</style></head><body>
<header><img src="assets/nuenaran-logo.svg" alt="نوینەران"><span>کۆمپانیای نوینەران — ئاسایش</span></header>
<main><form id="login"><img src="assets/nuenaran-logo.svg" alt="نوینەران"><h2>چوونەژوورەوە</h2><input id="password" type="password" autocomplete="current-password" aria-label="وشەی نهێنی" placeholder="وشەی نهێنی" required><button>چوونەژوورەوە</button><p id="error" role="alert"></p></form>
<section id="app" hidden><button id="logout">دەرچوون</button><p id="status" role="status">چاوەڕوانی داتا…</p><label for="complex">کۆمپڵێکس</label><select id="complex"><option value="">هەموو کۆمپڵێکسەکان</option></select><label for="search">ژمارەی خانوو یان ناو</label><input id="search" type="search" placeholder="گەڕان بە ژمارەی خانوو یان ناو"><div id="results"></div><nav><button id="prev">پێشوو</button><span id="count"></span><button id="next">دواتر</button></nav></section></main>
<script>
// Keep a failed module load from silently submitting/reloading the login form.
const loginForm=document.getElementById('login'),loginError=document.getElementById('error');
loginForm.addEventListener('submit',event=>event.preventDefault());
loginForm.querySelector('button').disabled=true;
loginError.textContent='Loading login…';
const loadTimer=setTimeout(()=>{loginError.textContent='Login could not load. Check your internet connection and refresh this page.';},12000);
import('./security.js?v=20261005-2').then(()=>{clearTimeout(loadTimer);loginForm.querySelector('button').disabled=false;loginError.textContent='';}).catch(()=>{clearTimeout(loadTimer);loginError.textContent='Login could not load. Open the online security page, check your internet connection, then refresh.';});
</script></body></html>
